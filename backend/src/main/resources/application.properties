spring.application.name=backend

# Default to local profile so gitignored application-local.properties can supply secrets.
# Override with SPRING_PROFILES_ACTIVE (for example: prod).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=jdbc:mysql://localhost:3306/neuroforge_nexus
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
