server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

app.bootstrap-admin.name=${ADMIN_FULL_NAME:System Admin}
app.bootstrap-admin.user-id=${ADMIN_USER_ID:admin}
app.bootstrap-admin.email=${ADMIN_EMAIL:admin@neuroforge.local}
app.bootstrap-admin.contact-number=${ADMIN_CONTACT:0000000000}
app.bootstrap-admin.password=${ADMIN_PASSWORD}

# --- AI Chatbot (Groq) ---
neuroforge.chat.api-key=${GROQ_API_KEY}
neuroforge.chat.base-url=https://api.groq.com/openai/v1
neuroforge.chat.model=openai/gpt-oss-120b

# --- GitHub API ---
github.token=${GITHUB_TOKEN}