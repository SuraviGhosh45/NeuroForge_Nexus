name: NeuroForge Nexus CI

'on':
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neuroforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Build and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and test backend
        run: mvn -B -f backend/pom.xml verify

      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: neuroforge-backend
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run ESLint
        run: npm run lint --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: neuroforge-frontend
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  backend-mysql-integration:
    name: Backend MySQL Integration Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-ci-password
          MYSQL_DATABASE: neuroforge_ci
          MYSQL_USER: neuroforge
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/neuroforge_ci?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USERNAME: neuroforge
      DB_PASSWORD: ci-password
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/neuroforge_ci?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: neuroforge
      SPRING_DATASOURCE_PASSWORD: ci-password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests against MySQL
        run: mvn -B -f backend/pom.xml verify

  docker-build:
    name: Docker Security Scan, Smoke Tests and Publish
    runs-on: ubuntu-latest
    needs: [backend, frontend, backend-mysql-integration]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase image owner
        shell: bash
        run: |
          IMAGE_OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_OWNER=$IMAGE_OWNER" >> "$GITHUB_ENV"

      - name: Build backend image for security scan
        run: docker build -t neuroforge-backend:scan ./backend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: neuroforge-backend:scan
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Build frontend image for security scan
        run: docker build -t neuroforge-frontend:scan ./frontend

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: neuroforge-frontend:scan
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Start MySQL for smoke tests
        run: |
          set -e
          docker network create neuroforge-smoke

          docker run -d \
            --name neuroforge-smoke-mysql \
            --network neuroforge-smoke \
            -e MYSQL_ROOT_PASSWORD=root-ci-password \
            -e MYSQL_DATABASE=neuroforge \
            -e MYSQL_USER=neuroforge \
            -e MYSQL_PASSWORD=ci-password \
            --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-password" \
            --health-interval=5s \
            --health-timeout=3s \
            --health-retries=30 \
            mysql:8.0

          for attempt in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' neuroforge-smoke-mysql 2>/dev/null || true)

            if [ "$status" = "healthy" ]; then
              echo "MySQL is healthy"
              exit 0
            fi

            sleep 2
          done

          docker logs neuroforge-smoke-mysql
          exit 1

      - name: Start backend container
        run: |
          docker run -d \
            --name neuroforge-smoke-backend \
            --network neuroforge-smoke \
            --network-alias backend \
            -p 8080:8080 \
            -e PORT=8080 \
            -e DB_URL="jdbc:mysql://neuroforge-smoke-mysql:3306/neuroforge?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC" \
            -e DB_USERNAME=neuroforge \
            -e DB_PASSWORD=ci-password \
            -e SPRING_DATASOURCE_URL="jdbc:mysql://neuroforge-smoke-mysql:3306/neuroforge?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC" \
            -e SPRING_DATASOURCE_USERNAME=neuroforge \
            -e SPRING_DATASOURCE_PASSWORD=ci-password \
            -e SPRING_JPA_HIBERNATE_DDL_AUTO=update \
            neuroforge-backend:scan

      - name: Test backend health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health -o backend-health.json 2>/dev/null; then
              cat backend-health.json
              grep -q '"status":"UP"' backend-health.json
              exit 0
            fi

            sleep 2
          done

          docker logs neuroforge-smoke-backend
          exit 1

      - name: Start frontend container
        run: |
          docker run -d \
            --name neuroforge-smoke-frontend \
            --network neuroforge-smoke \
            -p 3000:80 \
            neuroforge-frontend:scan

      - name: Test frontend and API proxy
        run: |
          set -e

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ -o frontend-index.html 2>/dev/null; then
              break
            fi

            sleep 2
          done

          test -s frontend-index.html
          echo "Frontend page loaded successfully"

          curl -fsS http://127.0.0.1:3000/api/health -o frontend-health.json
          cat frontend-health.json
          grep -q '"status":"UP"' frontend-health.json

          echo "Frontend API proxy works successfully"

      - name: Clean up smoke-test containers
        if: always()
        run: |
          docker rm -f neuroforge-smoke-frontend neuroforge-smoke-backend neuroforge-smoke-mysql || true
          docker network rm neuroforge-smoke || true

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/neuroforge-backend:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/neuroforge-backend:${{ github.ref_name }}
            ghcr.io/${{ env.IMAGE_OWNER }}/neuroforge-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/neuroforge-frontend:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/neuroforge-frontend:${{ github.ref_name }}
            ghcr.io/${{ env.IMAGE_OWNER }}/neuroforge-frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [backend, frontend, backend-mysql-integration, docker-build]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: NeuroForge Nexus ${{ github.ref_name }}
          generate_release_notes: true